<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Garmin Running Dashboard">
  <defs>
    <filter id="rfrGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <text x="32" y="39.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="23" fill="#19E0FF" filter="url(#rfrGlow)">RFR</text>
</svg>
